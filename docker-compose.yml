services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobapp
      POSTGRES_PASSWORD: jobapp
      POSTGRES_DB: jobapp
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  postgres_data:
